<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Web Test Studio — Intelligent Automation & Analytics Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0b0f19;
        --bg-sidebar: #111827;
        --bg-card: #1f2937;
        --bg-card-hover: #374151;
        --bg-input: #111827;
        --border-color: #374151;
        --border-light: #4b5563;
        --accent-green: #10b981;
        --accent-green-hover: #059669;
        --accent-blue: #38bdf8;
        --accent-purple: #8b5cf6;
        --accent-amber: #f59e0b;
        --accent-red: #ef4444;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.2);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }
      button, input, textarea { font-family: inherit; }
      button { cursor: pointer; border: none; outline: none; transition: all 0.2s ease; }

      .app {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }

      /* Sidebar Navigation */
      .sidebar {
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #fff;
        box-shadow: var(--shadow-glow);
      }
      .brand-text h2 { font-size: 15px; font-weight: 700; color: var(--text-primary); }
      .brand-text span { font-size: 11px; color: var(--accent-blue); font-weight: 500; }

      .new-btn {
        margin: 16px;
        padding: 12px 16px;
        background: linear-gradient(135deg, var(--accent-green), var(--accent-green-hover));
        color: #fff;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }
      .new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }

      .session-section-title {
        padding: 12px 20px 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
      }
      .sessions-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 16px;
      }
      .session-item {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 4px;
      }
      .session-item:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
      .session-item.active { background-color: rgba(16, 185, 129, 0.15); border-left: 3px solid var(--accent-green); color: var(--text-primary); }
      .session-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .session-meta { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--border-color);
        font-size: 12px;
        color: var(--text-secondary);
        background: rgba(0, 0, 0, 0.2);
      }

      /* Main Workspace */
      .workspace {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        height: 64px;
        padding: 0 28px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(17, 24, 39, 0.8);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .topbar-info h1 { font-size: 17px; font-weight: 700; color: var(--text-primary); }
      .topbar-info p { font-size: 12px; color: var(--text-secondary); }

      .engine-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--accent-blue);
        font-size: 12px;
        font-weight: 500;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

      /* Stats Overview Banner */
      .stats-banner {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 20px 28px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(17, 24, 39, 0.4);
      }
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
      .stat-value { font-size: 20px; font-weight: 700; color: var(--text-primary); }

      /* Target URL Bar */
      .url-bar {
        padding: 16px 28px;
        background: var(--bg-sidebar);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        gap: 12px;
      }
      .url-input-wrap {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }
      .url-icon {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        font-size: 14px;
      }
      .url-input {
        width: 100%;
        height: 42px;
        padding: 0 16px 0 40px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 13px;
      }
      .url-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); outline: none; }
      
      .btn-primary {
        height: 42px;
        padding: 0 20px;
        background: var(--accent-blue);
        color: #000;
        font-weight: 600;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn-primary:hover { background: #7dd3fc; }

      /* Main Content Body */
      .content {
        flex: 1;
        padding: 24px 28px 180px;
        overflow-y: auto;
      }
      .empty-state {
        max-width: 520px;
        margin: 60px auto;
        text-align: center;
        background: var(--bg-card);
        border: 1px dashed var(--border-light);
        border-radius: 16px;
        padding: 40px;
      }
      .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-primary); }
      .empty-state p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }

      .quick-prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chip-btn {
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-color);
        border-radius: 999px;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .chip-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); color: var(--text-primary); }

      /* Test Cards Timeline */
      .timeline {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .user-prompt-bubble {
        align-self: flex-end;
        max-width: 75%;
        padding: 12px 18px;
        background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
        border-radius: 16px 16px 2px 16px;
        font-size: 13px;
        line-height: 1.5;
        color: #fff;
        box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
      }
      .test-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: var(--shadow-lg);
        transition: border-color 0.2s ease;
      }
      .test-card:hover { border-color: var(--border-light); }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .card-title-group h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
      .card-timestamp { font-size: 11px; color: var(--text-muted); }

      .badge-group { display: flex; align-items: center; gap: 8px; }
      .source-tag {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .source-tag.qwen { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }
      .source-tag.workflow { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }

      .btn-run {
        padding: 8px 16px;
        background: var(--accent-green);
        color: #000;
        font-weight: 700;
        font-size: 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-run:hover { background: var(--accent-green-hover); }

      .btn-status {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.08);
      }
      .btn-status.passed { color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); }
      .btn-status.failed { color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
      .btn-status.warning { color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.4); }

      .expected-box {
        padding: 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 8px;
        border-left: 3px solid var(--accent-blue);
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .expected-box strong { color: var(--text-primary); }

      .steps-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .step-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .step-num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--border-color);
        color: var(--text-primary);
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Composer Input Wrap */
      .composer-wrap {
        position: fixed;
        bottom: 0;
        right: 0;
        left: 280px;
        padding: 20px 28px;
        background: rgba(17, 24, 39, 0.95);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--border-color);
        z-index: 8;
      }
      .composer-inner {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-box-row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }
      .prompt-textarea {
        flex: 1;
        min-height: 52px;
        max-height: 120px;
        padding: 14px 16px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 13.5px;
        resize: vertical;
      }
      .prompt-textarea:focus { border-color: var(--accent-blue); outline: none; }

      .btn-send {
        height: 52px;
        padding: 0 24px;
        background: linear-gradient(135deg, var(--accent-green), var(--accent-green-hover));
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow-glow);
      }
      .btn-send:hover { transform: translateY(-1px); }

      .composer-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .toggle-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .toggle-wrap input { width: 16px; height: 16px; accent-color: var(--accent-green); }

      /* Evidence Drawer Side Panel */
      .result-drawer {
        position: fixed;
        top: 0;
        right: -480px;
        width: 460px;
        height: 100vh;
        background: var(--bg-sidebar);
        border-left: 1px solid var(--border-color);
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        z-index: 20;
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
      }
      .result-drawer.open { right: 0; }
      
      .drawer-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .drawer-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
      .btn-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: var(--bg-card);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .status-banner-large {
        padding: 14px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
      }
      .status-banner-large.passed { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
      .status-banner-large.failed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
      .status-banner-large.warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

      .screenshot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
      .screenshot-item {
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        display: block;
      }
      .screenshot-item img { width: 100%; height: 80px; object-fit: cover; }
      .screenshot-item span { display: block; font-size: 10px; padding: 4px; background: var(--bg-card); text-align: center; color: var(--text-secondary); }

      .log-viewer {
        background: #090d16;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #d1d5db;
        white-space: pre-wrap;
        max-height: 240px;
        overflow-y: auto;
        line-height: 1.5;
      }

      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">AI</div>
          <div class="brand-text">
            <h2>Web Test Studio</h2>
            <span>Intelligent SQA Platform</span>
          </div>
        </div>
        <button id="newSession" class="new-btn" type="button">+ New Workspace</button>
        <div class="session-section-title">Saved Workspaces</div>
        <div id="sessions" class="sessions-list"></div>
        <div id="summary" class="sidebar-footer">Loading history...</div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main class="workspace">
        <header class="topbar">
          <div class="topbar-info">
            <h1 id="workspaceTitle">New Workspace</h1>
            <p id="workspaceMeta">Enter a target website URL to begin automated testing.</p>
          </div>
          <div id="health" class="engine-badge">
            <div class="pulse-dot"></div>
            <span>Checking Engine...</span>
          </div>
        </header>

        <!-- STATS OVERVIEW BANNER -->
        <div class="stats-banner">
          <div class="stat-card">
            <div class="stat-label">Total Test Cases</div>
            <div id="statCases" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Runs</div>
            <div id="statRuns" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pass Rate</div>
            <div id="statPassRate" class="stat-value" style="color: var(--accent-green);">0%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg Execution Latency</div>
            <div id="statDuration" class="stat-value" style="color: var(--accent-blue);">0 ms</div>
          </div>
        </div>

        <!-- TARGET URL INPUT BAR -->
        <div class="url-bar">
          <div class="url-input-wrap">
            <span class="url-icon">🌐</span>
            <input id="targetUrl" class="url-input" type="url" placeholder="https://example.com" />
          </div>
          <button id="saveUrl" class="btn-primary" type="button">Set Target</button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <section id="content" class="content"></section>

        <!-- COMPOSER INPUT -->
        <div class="composer-wrap">
          <div class="composer-inner">
            <div class="input-box-row">
              <textarea id="requirement" class="prompt-textarea" placeholder="Describe a test requirement (e.g. 'Search for wireless headphones'), or leave blank to generate a complete suite..."></textarea>
              <button id="generate" class="btn-send" type="button">Generate Test</button>
            </div>
            <div class="composer-options">
              <label class="toggle-wrap">
                <input id="showBrowser" type="checkbox" /> Show browser window during execution
              </label>
              <span id="activity">System Ready</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- RESULT EVIDENCE DRAWER -->
    <aside id="resultPanel" class="result-drawer">
      <div class="drawer-header">
        <span class="drawer-title">Execution Forensic Evidence</span>
        <button id="closeResult" class="btn-close" type="button">×</button>
      </div>
      <div id="resultBody" class="drawer-body"></div>
    </aside>

    <script>
      const state = { sessions: [], activeSession: null, tests: [], runs: [], busy: false };
      const el = id => document.getElementById(id);
      const API_BASE = ["8010", "8011", "8012", "8013", "8014", "8015"].includes(window.location.port) ? "http://127.0.0.1:8016" : "";
      const escapeHtml = val => String(val ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));

      async function request(url, options = {}) {
        const response = await fetch(`${API_BASE}${url}`, { cache: "no-store", ...options });
        const text = await response.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { detail: text || "Unexpected server response" }; }
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data);
          throw new Error(detail || "Request failed");
        }
        return data;
      }

      const api = {
        health: () => request("/api/health"),
        analytics: () => request("/api/analytics"),
        sessions: () => request("/api/sessions"),
        createSession: body => request("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        deleteSession: id => request(`/api/sessions/${id}`, { method: "DELETE" }),
        tests: sessionId => request(`/api/tests?session_id=${sessionId}`),
        runs: sessionId => request(`/api/runs?session_id=${sessionId}`),
        generate: body => request("/api/tests/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        suite: body => request("/api/tests/generate-suite", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        run: body => request("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
      };

      function setBusy(busy, msg = "System Ready") {
        state.busy = busy;
        el("generate").disabled = busy;
        el("newSession").disabled = busy;
        el("activity").textContent = msg;
      }

      function suiteRequested(text) {
        return !text || /\b(all|complete|comprehensive|full|major|multiple|suite|everything)\b/i.test(text);
      }

      function artifactUrl(path) {
        let suffix = String(path || "").split("artifacts").pop() || "";
        suffix = suffix.replaceAll("\\", "/").replace(/^\/+/, "");
        return `/artifacts/${encodeURI(suffix)}`;
      }

      function renderSessions() {
        el("sessions").innerHTML = state.sessions.length
          ? state.sessions.map(s => `
              <button class="session-item ${state.activeSession?.id === s.id ? "active" : ""}" data-session="${s.id}" type="button">
                <span class="session-title">${escapeHtml(s.title)}</span>
                <div class="session-meta">
                  <span>${escapeHtml(new URL(s.target_url).hostname)}</span>
                  <span>${s.test_count} tests · ${s.run_count} runs</span>
                </div>
              </button>`).join("")
          : '<div style="padding:16px; font-size:12px; color:var(--text-muted);">No saved workspaces yet.</div>';
        document.querySelectorAll("[data-session]").forEach(b => b.addEventListener("click", () => openSession(Number(b.dataset.session))));
      }

      function renderWorkspace() {
        if (!state.activeSession) {
          el("workspaceTitle").textContent = "New Workspace";
          el("workspaceMeta").textContent = "Enter a target URL above to start testing.";
          el("content").innerHTML = `
            <div class="empty-state">
              <h3>Create a Target Workspace</h3>
              <p>Enter a URL above to inspect page controls, generate natural-language test cases, and execute browser automation.</p>
              <div class="quick-prompts">
                <button class="chip-btn" onclick="quickFill('https://example.com', 'Check page availability and load')">Check Page Load</button>
                <button class="chip-btn" onclick="quickFill('https://example.com', 'Search for products and verify container')">Search Flow</button>
                <button class="chip-btn" onclick="quickFill('https://example.com', 'Verify invalid login rejection')">Auth Rejection</button>
              </div>
            </div>`;
          return;
        }
        el("workspaceTitle").textContent = state.activeSession.title;
        el("workspaceMeta").textContent = `${state.tests.length} saved test cases · ${state.runs.length} runs recorded`;
        el("targetUrl").value = state.activeSession.target_url;
        
        if (!state.tests.length) {
          el("content").innerHTML = `
            <div class="empty-state">
              <h3>Workspace Initialized</h3>
              <p>Type a requirement prompt below, or leave it blank to generate an exploratory suite.</p>
              <div class="quick-prompts">
                <button class="chip-btn" onclick="el('requirement').value='Verify main navigation menu links'">Navigation Links</button>
                <button class="chip-btn" onclick="el('requirement').value='Check search input and results'">Search Bar</button>
                <button class="chip-btn" onclick="el('requirement').value=''">Exploratory Suite</button>
              </div>
            </div>`;
          return;
        }

        el("content").innerHTML = `<div class="timeline">${state.tests.slice().reverse().map(test => {
          const latestRun = state.runs.find(r => r.test_case_id === test.id);
          return `
          <div class="user-prompt-bubble">💬 ${escapeHtml(test.requirement || "Generated Exploratory Test Suite")}</div>
          <article class="test-card">
            <div class="card-header">
              <div class="card-title-group">
                <h3>${escapeHtml(test.name)}</h3>
                <span class="card-timestamp">Created ${new Date(test.created_at).toLocaleString()}</span>
              </div>
              <div class="badge-group">
                ${latestRun ? `<button class="btn-status ${escapeHtml(latestRun.status)}" data-result="${latestRun.id}" type="button">${escapeHtml(latestRun.status)}</button>` : ""}
                <span class="source-tag ${test.generation_source === "qwen-ai" ? "qwen" : "workflow"}">${test.generation_source === "qwen-ai" ? "Qwen LLM" : "Workflow"}</span>
                <button class="btn-run" data-run="${test.id}" type="button">▶ Run Test</button>
              </div>
            </div>
            <div class="expected-box"><strong>Expected Outcome:</strong> ${escapeHtml(test.expected_result)}</div>
            <div class="steps-list">${test.steps.map((step, idx) => `
              <div class="step-item">
                <span class="step-num">${idx + 1}</span>
                <span>${escapeHtml(step.description)}</span>
              </div>`).join("")}
            </div>
          </article>`;
        }).join("")}</div>`;

        document.querySelectorAll("[data-run]").forEach(b => b.addEventListener("click", () => runTest(Number(b.dataset.run))));
        document.querySelectorAll("[data-result]").forEach(b => b.addEventListener("click", () => {
          const run = state.runs.find(r => r.id === Number(b.dataset.result));
          if (run) showResult(run);
        }));
      }

      function quickFill(url, req) {
        el("targetUrl").value = url;
        el("requirement").value = req;
        el("requirement").focus();
      }

      async function loadSummary() {
        const analytics = await api.analytics();
        el("statCases").textContent = analytics.total_cases;
        el("statRuns").textContent = analytics.total_runs;
        el("statPassRate").textContent = `${analytics.pass_rate}%`;
        el("statDuration").textContent = `${analytics.average_duration_ms} ms`;
        el("summary").textContent = `${analytics.total_cases} test cases · ${analytics.total_runs} runs · ${analytics.pass_rate}% pass rate`;
      }

      async function loadSessions(preferredId = null) {
        state.sessions = await api.sessions();
        const id = preferredId ?? state.activeSession?.id;
        state.activeSession = state.sessions.find(s => s.id === id) || state.sessions[0] || null;
        renderSessions();
        if (state.activeSession) await loadActiveSession();
        else renderWorkspace();
        await loadSummary();
      }

      async function loadActiveSession() {
        [state.tests, state.runs] = await Promise.all([api.tests(state.activeSession.id), api.runs(state.activeSession.id)]);
        renderSessions();
        renderWorkspace();
      }

      async function openSession(id) {
        state.activeSession = state.sessions.find(s => s.id === id) || null;
        await loadActiveSession();
      }

      function newSession() {
        state.activeSession = null;
        state.tests = [];
        state.runs = [];
        el("targetUrl").value = "";
        el("requirement").value = "";
        renderSessions();
        renderWorkspace();
        el("targetUrl").focus();
      }

      async function ensureSession(targetUrl, requirement) {
        if (state.activeSession) {
          if (state.activeSession.target_url !== targetUrl) throw new Error("Click New Workspace before changing target URL.");
          return state.activeSession;
        }
        const title = requirement.trim().slice(0, 80) || `Workspace: ${new URL(targetUrl).hostname}`;
        const session = await api.createSession({ target_url: targetUrl, title });
        state.activeSession = session;
        return session;
      }

      async function generate() {
        const target_url = el("targetUrl").value.trim();
        const requirement = el("requirement").value.trim();
        if (!target_url) return el("targetUrl").focus();
        setBusy(true, "Inspecting DOM controls & generating test...");
        try {
          const session = await ensureSession(target_url, requirement);
          const body = { target_url, requirement, session_id: session.id };
          if (suiteRequested(requirement)) await api.suite(body);
          else await api.generate(body);
          el("requirement").value = "";
          await loadSessions(session.id);
          el("content").scrollTo({ top: el("content").scrollHeight, behavior: "smooth" });
        } catch (error) {
          el("activity").textContent = error.message;
        } finally {
          setBusy(false, "System Ready");
        }
      }

      async function runTest(testCaseId) {
        setBusy(true, "Executing Playwright Chromium browser session...");
        try {
          const run = await api.run({ test_case_id: testCaseId, show_browser: el("showBrowser").checked });
          showResult(run);
          await loadSessions(state.activeSession.id);
        } catch (error) {
          showResult({ status: "failed", summary: "The run could not start.", error_summary: error.message, logs: [], screenshots: [] });
        } finally {
          setBusy(false, "System Ready");
        }
      }

      function showResult(run) {
        const logs = (run.logs || []).map(item => `[${item.level.toUpperCase()}] ${item.message}`).join("\n");
        const screenshots = (run.screenshots || []).map((path, idx) => `
          <a class="screenshot-item" href="${artifactUrl(path)}" target="_blank">
            <img src="${artifactUrl(path)}" alt="Screenshot frame ${idx+1}" />
            <span>Frame ${idx + 1}</span>
          </a>`).join("");

        el("resultBody").innerHTML = `
          <div class="status-banner-large ${escapeHtml(run.status)}">Status: ${escapeHtml(run.status)}</div>
          <div style="font-size:13px; line-height:1.5;">${escapeHtml(run.summary)}</div>
          ${run.error_summary ? `<div style="font-size:12px; color:var(--accent-red); background:rgba(239,68,68,0.1); padding:10px; border-radius:6px;">${escapeHtml(run.error_summary)}</div>` : ""}
          <div style="font-size:12px; font-weight:700; margin-top:8px;">Execution Screenshots:</div>
          <div class="screenshot-grid">${screenshots || '<span style="font-size:12px; color:var(--text-muted);">No screenshots captured</span>'}</div>
          <div style="font-size:12px; font-weight:700; margin-top:8px;">Console & Step Logs:</div>
          <div class="log-viewer">${escapeHtml(logs || "No logs recorded.")}</div>`;
        el("resultPanel").classList.add("open");
      }

      el("newSession").addEventListener("click", newSession);
      el("generate").addEventListener("click", generate);
      el("saveUrl").addEventListener("click", () => el("requirement").focus());
      el("closeResult").addEventListener("click", () => el("resultPanel").classList.remove("open"));
      el("requirement").addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
      });

      Promise.all([api.health(), loadSessions()])
        .then(([health]) => {
          el("health").querySelector("span").textContent = health.llm?.available && health.llm?.model_installed
            ? `Qwen AI Engine Ready (${health.llm.model})`
            : "Deterministic Rule Engine Ready";
        })
        .catch(error => {
          el("health").querySelector("span").textContent = "Backend Offline";
          el("activity").textContent = error.message;
        });
    </script>
  </body>
</html>
