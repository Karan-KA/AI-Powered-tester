<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Web Test Studio — Quality Automation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-app: #f8fafc;
        --bg-surface: #ffffff;
        --bg-subtle: #f1f5f9;
        --border-light: #e2e8f0;
        --border-strong: #cbd5e1;
        
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-light: #eeef2;
        
        --text-dark: #0f172a;
        --text-body: #334155;
        --text-muted: #64748b;
        
        --emerald-bg: #ecfdf5;
        --emerald-text: #047857;
        --emerald-border: #a7f3d0;
        
        --rose-bg: #fff1f2;
        --rose-text: #be123c;
        --rose-border: #fecdd3;
        
        --amber-bg: #fffbeb;
        --amber-text: #b45309;
        --amber-border: #fde68a;
        
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-app);
        color: var(--text-body);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea { font-family: inherit; }
      button { cursor: pointer; border: none; outline: none; transition: all 0.15s ease; }

      .app-layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        background: var(--bg-surface);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: sticky;
        top: 0;
      }
      .brand-header {
        padding: 24px 20px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border-light);
      }
      .brand-logo {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 800;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
      }
      .brand-title { font-size: 16px; font-weight: 700; color: var(--text-dark); letter-spacing: -0.3px; }
      .brand-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 500; }

      .btn-new-site {
        margin: 16px 20px;
        padding: 11px 16px;
        background: var(--primary);
        color: #ffffff;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
      }
      .btn-new-site:hover { background: var(--primary-hover); transform: translateY(-1px); }

      .sidebar-label {
        padding: 12px 20px 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
      }
      .sessions-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 16px;
      }
      .session-card {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        background: transparent;
        color: var(--text-body);
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 4px;
      }
      .session-card:hover { background: var(--bg-subtle); }
      .session-card.active { background: #eef2ff; border-left: 3px solid var(--primary); }
      .session-card.active .session-name { color: var(--primary); font-weight: 700; }
      .session-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .session-meta-text { font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; }

      .sidebar-footer-info {
        padding: 16px 20px;
        border-top: 1px solid var(--border-light);
        font-size: 12px;
        color: var(--text-muted);
        background: var(--bg-surface);
      }

      /* Main Workspace Area */
      .main-workspace {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .top-navbar {
        height: 68px;
        padding: 0 32px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .nav-title h1 { font-size: 18px; font-weight: 700; color: var(--text-dark); letter-spacing: -0.3px; }
      .nav-title p { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-light);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-body);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
      }

      /* Overview Analytics Header Bar */
      .analytics-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 24px 32px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-light);
      }
      .metric-box {
        background: var(--bg-subtle);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .metric-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
      .metric-val { font-size: 22px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }

      /* Target Input Hero Bar */
      .target-hero-bar {
        padding: 20px 32px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-light);
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .url-input-container {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }
      .url-prefix-icon {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        font-size: 14px;
      }
      .input-target-url {
        width: 100%;
        height: 44px;
        padding: 0 16px 0 42px;
        background: var(--bg-app);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        color: var(--text-dark);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.15s ease;
      }
      .input-target-url:focus {
        background: #ffffff;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        outline: none;
      }
      .btn-set-url {
        height: 44px;
        padding: 0 22px;
        background: var(--text-dark);
        color: #ffffff;
        font-weight: 600;
        font-size: 13.5px;
        border-radius: 8px;
      }
      .btn-set-url:hover { background: #1e293b; }

      /* Main Workspace Scroll Area */
      .workspace-content {
        flex: 1;
        padding: 28px 32px 180px;
        overflow-y: auto;
      }

      /* Empty Initial State */
      .empty-placeholder {
        max-width: 580px;
        margin: 40px auto;
        text-align: center;
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        border-radius: 16px;
        padding: 44px 36px;
        box-shadow: var(--shadow-md);
      }
      .empty-placeholder h3 { font-size: 19px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
      .empty-placeholder p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }

      .preset-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chip-item {
        padding: 8px 16px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text-body);
        font-size: 12.5px;
        font-weight: 600;
      }
      .chip-item:hover { background: #eef2ff; border-color: var(--primary); color: var(--primary); }

      /* Timeline & Test Cards */
      .cards-timeline {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .prompt-bubble {
        align-self: flex-end;
        max-width: 80%;
        padding: 12px 18px;
        background: var(--primary);
        color: #ffffff;
        border-radius: 16px 16px 4px 16px;
        font-size: 13.5px;
        line-height: 1.5;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
      }
      .test-card-box {
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease;
      }
      .test-card-box:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

      .test-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .test-title-text { font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; letter-spacing: -0.2px; }
      .test-meta-date { font-size: 12px; color: var(--text-muted); }

      .card-actions-group { display: flex; align-items: center; gap: 10px; }
      
      .pill-tag {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .pill-tag.qwen { background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; }
      .pill-tag.workflow { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

      .btn-run-case {
        padding: 8px 16px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        font-size: 12.5px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-run-case:hover { background: var(--primary-hover); }

      .btn-status-view {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .btn-status-view.passed { background: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
      .btn-status-view.failed { background: var(--rose-bg); color: var(--rose-text); border: 1px solid var(--rose-border); }
      .btn-status-view.warning { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }

      .expected-callout {
        padding: 12px 16px;
        background: var(--bg-subtle);
        border-radius: 8px;
        border-left: 3px solid var(--primary);
        font-size: 13px;
        color: var(--text-body);
        line-height: 1.5;
      }
      .expected-callout strong { color: var(--text-dark); }

      .steps-checklist {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .step-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
        background: var(--bg-app);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-body);
      }
      .step-badge {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--bg-surface);
        border: 1px solid var(--border-strong);
        color: var(--text-dark);
        font-size: 11.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Input Composer Fixed Bar */
      .composer-container {
        position: fixed;
        bottom: 0;
        right: 0;
        left: 280px;
        padding: 20px 32px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border-light);
        z-index: 20;
      }
      .composer-box {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .composer-row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }
      .prompt-input-area {
        flex: 1;
        min-height: 52px;
        max-height: 120px;
        padding: 14px 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        color: var(--text-dark);
        font-size: 14px;
        resize: vertical;
        box-shadow: var(--shadow-sm);
      }
      .prompt-input-area:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); outline: none; }

      .btn-generate-send {
        height: 52px;
        padding: 0 26px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        font-size: 14px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      }
      .btn-generate-send:hover { background: var(--primary-hover); transform: translateY(-1px); }

      .composer-footer-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .checkbox-label input { width: 16px; height: 16px; accent-color: var(--primary); }

      /* Evidence Side Drawer */
      .evidence-drawer {
        position: fixed;
        top: 0;
        right: -480px;
        width: 460px;
        height: 100vh;
        background: var(--bg-surface);
        border-left: 1px solid var(--border-light);
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08);
        z-index: 30;
        transition: right 0.25s ease;
        display: flex;
        flex-direction: column;
      }
      .evidence-drawer.open { right: 0; }
      
      .drawer-top {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .drawer-header-title { font-size: 16.5px; font-weight: 700; color: var(--text-dark); }
      .btn-close-drawer {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: var(--bg-subtle);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .btn-close-drawer:hover { color: var(--text-dark); background: var(--border-light); }

      .drawer-content {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .status-banner-card {
        padding: 14px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
      }
      .status-banner-card.passed { background: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
      .status-banner-card.failed { background: var(--rose-bg); color: var(--rose-text); border: 1px solid var(--rose-border); }
      .status-banner-card.warning { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }

      .screenshot-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
      }
      .screenshot-card-link {
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-light);
        text-decoration: none;
        background: var(--bg-app);
        box-shadow: var(--shadow-sm);
      }
      .screenshot-card-link img { width: 100%; height: 85px; object-fit: cover; }
      .screenshot-card-link span { display: block; font-size: 11px; padding: 6px; text-align: center; color: var(--text-muted); font-weight: 600; }

      .log-console-box {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        color: #e2e8f0;
        white-space: pre-wrap;
        max-height: 260px;
        overflow-y: auto;
        line-height: 1.65;
      }

      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="brand-header">
          <div class="brand-logo">AI</div>
          <div>
            <div class="brand-title">Web Test Studio</div>
            <div class="brand-subtitle">Automated SQA Platform</div>
          </div>
        </div>
        <button id="newSession" class="btn-new-site" type="button">+ New Workspace</button>
        <div class="sidebar-label">Saved Workspaces</div>
        <div id="sessions" class="sessions-container"></div>
        <div id="summary" class="sidebar-footer-info">Loading session history...</div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main class="main-workspace">
        <header class="top-navbar">
          <div class="nav-title">
            <h1 id="workspaceTitle">New Workspace</h1>
            <p id="workspaceMeta">Set target website URL to begin generating automated browser tests.</p>
          </div>
          <div id="health" class="status-pill">
            <div class="status-dot"></div>
            <span>Checking Engine...</span>
          </div>
        </header>

        <!-- ANALYTICS METRICS HEADER -->
        <div class="analytics-bar">
          <div class="metric-box">
            <div class="metric-title">Test Cases</div>
            <div id="statCases" class="metric-val">0</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Total Runs</div>
            <div id="statRuns" class="metric-val">0</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Pass Rate</div>
            <div id="statPassRate" class="metric-val" style="color: #047857;">0%</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Avg Latency</div>
            <div id="statDuration" class="metric-val" style="color: var(--primary);">0 ms</div>
          </div>
        </div>

        <!-- TARGET URL HERO BAR -->
        <div class="target-hero-bar">
          <div class="url-input-container">
            <span class="url-prefix-icon">🌐</span>
            <input id="targetUrl" class="input-target-url" type="url" placeholder="https://example.com" />
          </div>
          <button id="saveUrl" class="btn-set-url" type="button">Set Target</button>
        </div>

        <!-- WORKSPACE CONTENT AREA -->
        <section id="content" class="workspace-content"></section>

        <!-- FLOATING COMPOSER INPUT BAR -->
        <div class="composer-container">
          <div class="composer-box">
            <div class="composer-row">
              <textarea id="requirement" class="prompt-input-area" placeholder="Describe a test requirement (e.g. 'Test search bar and verify results'), or leave blank for a full exploratory suite..."></textarea>
              <button id="generate" class="btn-generate-send" type="button">Generate Test</button>
            </div>
            <div class="composer-footer-options">
              <label class="checkbox-label">
                <input id="showBrowser" type="checkbox" /> Show browser window during execution
              </label>
              <span id="activity">System Ready</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- EVIDENCE SIDE DRAWER -->
    <aside id="resultPanel" class="evidence-drawer">
      <div class="drawer-top">
        <span class="drawer-header-title">Forensic Run Evidence</span>
        <button id="closeResult" class="btn-close-drawer" type="button">×</button>
      </div>
      <div id="resultBody" class="drawer-content"></div>
    </aside>

    <script>
      const state = { sessions: [], activeSession: null, tests: [], runs: [], busy: false };
      const el = id => document.getElementById(id);
      const API_BASE = ["8010", "8011", "8012", "8013", "8014", "8015"].includes(window.location.port) ? "http://127.0.0.1:8016" : "";
      const escapeHtml = val => String(val ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));

      async function request(url, options = {}) {
        const response = await fetch(`${API_BASE}${url}`, { cache: "no-store", ...options });
        const text = await response.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { detail: text || "Unexpected server response" }; }
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data);
          throw new Error(detail || "Request failed");
        }
        return data;
      }

      const api = {
        health: () => request("/api/health"),
        analytics: () => request("/api/analytics"),
        sessions: () => request("/api/sessions"),
        createSession: body => request("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        deleteSession: id => request(`/api/sessions/${id}`, { method: "DELETE" }),
        tests: sessionId => request(`/api/tests?session_id=${sessionId}`),
        runs: sessionId => request(`/api/runs?session_id=${sessionId}`),
        generate: body => request("/api/tests/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        suite: body => request("/api/tests/generate-suite", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
        run: body => request("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
      };

      function setBusy(busy, msg = "System Ready") {
        state.busy = busy;
        el("generate").disabled = busy;
        el("newSession").disabled = busy;
        el("activity").textContent = msg;
      }

      function suiteRequested(text) {
        return !text || /\b(all|complete|comprehensive|full|major|multiple|suite|everything)\b/i.test(text);
      }

      function artifactUrl(path) {
        let suffix = String(path || "").split("artifacts").pop() || "";
        suffix = suffix.replaceAll("\\", "/").replace(/^\/+/, "");
        return `/artifacts/${encodeURI(suffix)}`;
      }

      function renderSessions() {
        el("sessions").innerHTML = state.sessions.length
          ? state.sessions.map(s => `
              <button class="session-card ${state.activeSession?.id === s.id ? "active" : ""}" data-session="${s.id}" type="button">
                <span class="session-name">${escapeHtml(s.title)}</span>
                <div class="session-meta-text">
                  <span>${escapeHtml(new URL(s.target_url).hostname)}</span>
                  <span>${s.test_count} tests · ${s.run_count} runs</span>
                </div>
              </button>`).join("")
          : '<div style="padding:16px; font-size:12px; color:var(--text-muted);">No saved workspaces.</div>';
        document.querySelectorAll("[data-session]").forEach(b => b.addEventListener("click", () => openSession(Number(b.dataset.session))));
      }

      function renderWorkspace() {
        if (!state.activeSession) {
          el("workspaceTitle").textContent = "New Workspace";
          el("workspaceMeta").textContent = "Set target website URL to begin generating automated browser tests.";
          el("content").innerHTML = `
            <div class="empty-placeholder">
              <h3>Create Target Workspace</h3>
              <p>Enter a target URL above to inspect page controls, generate structured test cases, and execute browser automation.</p>
              <div class="preset-chips">
                <button class="chip-item" onclick="quickFill('https://example.com', 'Check home page load and title')">Check Page Load</button>
                <button class="chip-item" onclick="quickFill('https://example.com', 'Search for products and verify results')">Search Flow</button>
                <button class="chip-item" onclick="quickFill('https://example.com', 'Verify invalid password login rejection')">Auth Rejection</button>
              </div>
            </div>`;
          return;
        }
        el("workspaceTitle").textContent = state.activeSession.title;
        el("workspaceMeta").textContent = `${state.tests.length} test cases · ${state.runs.length} runs recorded`;
        el("targetUrl").value = state.activeSession.target_url;

        if (!state.tests.length) {
          el("content").innerHTML = `
            <div class="empty-placeholder">
              <h3>Workspace Active</h3>
              <p>Type a natural language requirement prompt below, or leave it blank to generate an exploratory suite.</p>
              <div class="preset-chips">
                <button class="chip-item" onclick="el('requirement').value='Verify main navigation menu links'">Navigation Links</button>
                <button class="chip-item" onclick="el('requirement').value='Check search input and results'">Search Bar</button>
                <button class="chip-item" onclick="el('requirement').value=''">Exploratory Suite</button>
              </div>
            </div>`;
          return;
        }

        el("content").innerHTML = `<div class="cards-timeline">${state.tests.slice().reverse().map(test => {
          const latestRun = state.runs.find(r => r.test_case_id === test.id);
          return `
          <div class="prompt-bubble">💬 ${escapeHtml(test.requirement || "Generated Exploratory Test Suite")}</div>
          <article class="test-card-box">
            <div class="test-card-header">
              <div>
                <div class="test-title-text">${escapeHtml(test.name)}</div>
                <div class="test-meta-date">Created ${new Date(test.created_at).toLocaleString()}</div>
              </div>
              <div class="card-actions-group">
                ${latestRun ? `<button class="btn-status-view ${escapeHtml(latestRun.status)}" data-result="${latestRun.id}" type="button">${escapeHtml(latestRun.status)}</button>` : ""}
                <span class="pill-tag ${test.generation_source === "qwen-ai" ? "qwen" : "workflow"}">${test.generation_source === "qwen-ai" ? "Qwen LLM" : "Workflow"}</span>
                <button class="btn-run-case" data-run="${test.id}" type="button">▶ Run Test</button>
              </div>
            </div>
            <div class="expected-callout"><strong>Expected Outcome:</strong> ${escapeHtml(test.expected_result)}</div>
            <div class="steps-checklist">${test.steps.map((step, idx) => `
              <div class="step-row">
                <span class="step-badge">${idx + 1}</span>
                <span>${escapeHtml(step.description)}</span>
              </div>`).join("")}
            </div>
          </article>`;
        }).join("")}</div>`;

        document.querySelectorAll("[data-run]").forEach(b => b.addEventListener("click", () => runTest(Number(b.dataset.run))));
        document.querySelectorAll("[data-result]").forEach(b => b.addEventListener("click", () => {
          const run = state.runs.find(r => r.id === Number(b.dataset.result));
          if (run) showResult(run);
        }));
      }

      function quickFill(url, req) {
        el("targetUrl").value = url;
        el("requirement").value = req;
        el("requirement").focus();
      }

      async function loadSummary() {
        const analytics = await api.analytics();
        el("statCases").textContent = analytics.total_cases;
        el("statRuns").textContent = analytics.total_runs;
        el("statPassRate").textContent = `${analytics.pass_rate}%`;
        el("statDuration").textContent = `${analytics.average_duration_ms} ms`;
        el("summary").textContent = `${analytics.total_cases} test cases · ${analytics.total_runs} runs · ${analytics.pass_rate}% pass rate`;
      }

      async function loadSessions(preferredId = null) {
        state.sessions = await api.sessions();
        const id = preferredId ?? state.activeSession?.id;
        state.activeSession = state.sessions.find(s => s.id === id) || state.sessions[0] || null;
        renderSessions();
        if (state.activeSession) await loadActiveSession();
        else renderWorkspace();
        await loadSummary();
      }

      async function loadActiveSession() {
        [state.tests, state.runs] = await Promise.all([api.tests(state.activeSession.id), api.runs(state.activeSession.id)]);
        renderSessions();
        renderWorkspace();
      }

      async function openSession(id) {
        state.activeSession = state.sessions.find(s => s.id === id) || null;
        await loadActiveSession();
      }

      function newSession() {
        state.activeSession = null;
        state.tests = [];
        state.runs = [];
        el("targetUrl").value = "";
        el("requirement").value = "";
        renderSessions();
        renderWorkspace();
        el("targetUrl").focus();
      }

      async function ensureSession(targetUrl, requirement) {
        if (state.activeSession) {
          if (state.activeSession.target_url !== targetUrl) throw new Error("Click New Workspace before changing target URL.");
          return state.activeSession;
        }
        const title = requirement.trim().slice(0, 80) || `Workspace: ${new URL(targetUrl).hostname}`;
        const session = await api.createSession({ target_url: targetUrl, title });
        state.activeSession = session;
        return session;
      }

      async function generate() {
        const target_url = el("targetUrl").value.trim();
        const requirement = el("requirement").value.trim();
        if (!target_url) return el("targetUrl").focus();
        setBusy(true, "Inspecting page controls & generating test...");
        try {
          const session = await ensureSession(target_url, requirement);
          const body = { target_url, requirement, session_id: session.id };
          if (suiteRequested(requirement)) await api.suite(body);
          else await api.generate(body);
          el("requirement").value = "";
          await loadSessions(session.id);
          el("content").scrollTo({ top: el("content").scrollHeight, behavior: "smooth" });
        } catch (error) {
          el("activity").textContent = error.message;
        } finally {
          setBusy(false, "System Ready");
        }
      }

      async function runTest(testCaseId) {
        setBusy(true, "Executing Playwright Chromium browser session...");
        try {
          const run = await api.run({ test_case_id: testCaseId, show_browser: el("showBrowser").checked });
          showResult(run);
          await loadSessions(state.activeSession.id);
        } catch (error) {
          showResult({ status: "failed", summary: "The run could not start.", error_summary: error.message, logs: [], screenshots: [] });
        } finally {
          setBusy(false, "System Ready");
        }
      }

      function showResult(run) {
        const logs = (run.logs || []).map(item => `[${item.level.toUpperCase()}] ${item.message}`).join("\n");
        const screenshots = (run.screenshots || []).map((path, idx) => `
          <a class="screenshot-card-link" href="${artifactUrl(path)}" target="_blank">
            <img src="${artifactUrl(path)}" alt="Screenshot frame ${idx+1}" />
            <span>Frame ${idx + 1}</span>
          </a>`).join("");

        el("resultBody").innerHTML = `
          <div class="status-banner-card ${escapeHtml(run.status)}">Status: ${escapeHtml(run.status)}</div>
          <div style="font-size:13.5px; line-height:1.5;">${escapeHtml(run.summary)}</div>
          ${run.error_summary ? `<div style="font-size:12.5px; color:var(--rose-text); background:var(--rose-bg); border:1px solid var(--rose-border); padding:12px; border-radius:8px;">${escapeHtml(run.error_summary)}</div>` : ""}
          <div style="font-size:13px; font-weight:700; margin-top:6px; color:var(--text-dark);">Captured Screenshots:</div>
          <div class="screenshot-container">${screenshots || '<span style="font-size:12.5px; color:var(--text-muted);">No screenshots captured</span>'}</div>
          <div style="font-size:13px; font-weight:700; margin-top:6px; color:var(--text-dark);">Console & Step Execution Logs:</div>
          <div class="log-console-box">${escapeHtml(logs || "No logs recorded.")}</div>`;
        el("resultPanel").classList.add("open");
      }

      el("newSession").addEventListener("click", newSession);
      el("generate").addEventListener("click", generate);
      el("saveUrl").addEventListener("click", () => el("requirement").focus());
      el("closeResult").addEventListener("click", () => el("resultPanel").classList.remove("open"));
      el("requirement").addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
      });

      Promise.all([api.health(), loadSessions()])
        .then(([health]) => {
          el("health").querySelector("span").textContent = health.llm?.available && health.llm?.model_installed
            ? `Qwen AI Ready (${health.llm.model})`
            : "Deterministic Engine Ready";
        })
        .catch(error => {
          el("health").querySelector("span").textContent = "Backend Offline";
          el("activity").textContent = error.message;
        });
    </script>
  </body>
</html>
